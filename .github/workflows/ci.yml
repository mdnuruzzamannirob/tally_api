name: API CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tally
          POSTGRES_PASSWORD: tally
          POSTGRES_DB: tally_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tally -d tally_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tally:tally@localhost:5432/tally_test
      TEST_DATABASE_URL: postgresql://tally:tally@localhost:5432/tally_test
      API_BASE_URL: http://localhost:4000
      WEB_APP_URL: http://localhost:3000
      ACCESS_TOKEN_SECRET: ci-test-access-token-secret-at-least-32-bytes
      EMAIL_FROM: no-reply@tally.test
      EMAIL_PROVIDER: console
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm prisma:generate
      - name: Apply migrations
        run: pnpm prisma:deploy
      - name: Regenerate and verify OpenAPI artifact
        run: |
          pnpm openapi:generate
          git diff --exit-code -- contracts/openapi.json
      - name: Validate OpenAPI contract
        run: pnpm openapi:validate
      - name: Audit identity boundary
        run: pnpm audit:identity
      - name: Audit repository boundary
        run: pnpm audit:boundary
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Format check
        run: pnpm format
      - name: Test
        run: pnpm test:all
      - name: Build
        run: pnpm build
      - name: Build runtime Docker image
        run: >-
          docker build --target runtime
          --build-arg PRISMA_GENERATE_DATABASE_URL="$DATABASE_URL"
          --tag tally-api:ci .
      - name: Release smoke test
        run: |
          pnpm start > /tmp/tally-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          API_BASE_URL=http://127.0.0.1:4000 WEB_APP_URL=http://localhost:3000 pnpm test:smoke
