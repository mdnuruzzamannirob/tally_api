services:
  api:
    build:
      context: .
      target: runtime
      args:
        PRISMA_GENERATE_DATABASE_URL: ${PRISMA_GENERATE_DATABASE_URL}
    env_file:
      - path: .env.production
        required: false
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5000/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  migrate:
    build:
      context: .
      target: migration
      args:
        PRISMA_GENERATE_DATABASE_URL: ${PRISMA_GENERATE_DATABASE_URL}
    env_file:
      - path: .env.production
        required: false
    command: ["pnpm", "db:deploy"]
    profiles: ["migration"]
